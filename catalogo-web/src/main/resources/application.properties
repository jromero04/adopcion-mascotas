spring.application.name=adopcion-mascotas

# Base local de desarrollo. En Jenkins se indicara otra ubicacion mediante
# la variable de entorno ADOPCION_DB_URL.
spring.datasource.url=${ADOPCION_DB_URL:jdbc:h2:file:./datos/adopcion-dev}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${ADOPCION_DB_USERNAME:sa}
spring.datasource.password=${ADOPCION_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
